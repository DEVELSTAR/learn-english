# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in storage or configure via DATABASE_URL for PostgreSQL / Supabase.
production:
  primary: &primary_production
    <% if ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    <%
      db_url = ENV["DATABASE_URL"].to_s.strip
      if db_url.include?("://")
        scheme, rest = db_url.split("://", 2)
        if rest && rest.include?("@")
          userinfo, _, host_and_path = rest.rpartition("@")
          if userinfo.include?(":")
            user, pass = userinfo.split(":", 2)
            encoded_pass = CGI.escape(CGI.unescape(pass)).gsub("+", "%20")
            db_url = "#{scheme}://#{user}:#{encoded_pass}@#{host_and_path}"
          end
        end
      end
    %>
    url: <%= db_url %>
    prepared_statements: false
    <% else %>
    <<: *default
    database: storage/production.sqlite3
    <% end %>

